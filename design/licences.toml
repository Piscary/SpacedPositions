# Licences of files in spaced_positions/static/vendor/ (spec 09 §13). `design check` fails for a vendored file
# that isn't listed here or whose licence is not GPL-3.0-compatible.

[vendor."htmx.min.js"]
licence = "0BSD (Zero-Clause BSD)"
source = "htmx.org 2.0.11, https://htmx.org"

[vendor."chessground.min.js"]
licence = "GPL-3.0-or-later"
source = "chessground 9.2.1 (lichess), https://github.com/lichess-org/chessground · licences/chessground.LICENSE"

[vendor."chessground.base.css"]
licence = "GPL-3.0-or-later"
source = "chessground 9.2.1 assets"

[vendor."chess.js"]
licence = "BSD-2-Clause"
source = "chess.js 1.4.0, https://github.com/jhlywa/chess.js · licences/chess.js.LICENSE"

