# Default bindings by context (spec 02 §4–5, 08). Resolution order for a key press:
#   overlay → layer.<layer> → state.<state> (Train: launcher, solving, feedback, result) → view.<view> →
#   mode.<mode> → pane → global
# Keys: see spec 08 · Notation. A value is a command id, optionally followed by arguments: "pane.focus 3".
# `design check` rejects conflicts, browser-reserved keys and keys that are both a command and a prefix.

# Keys that need AltGr/Option on QWERTZ or AZERTY but are accepted for the defaults, because the primary layout is
# QWERTY (spec 10 · decision 1). Each still has a way in through the command line.
[layout]
accept = ["[", "]"]

[prefixes]
"space" = "Leader"
"space w" = "Window"
"space u" = "UI toggles"
"g" = "Go"
"m" = "Mark"
"p" = "Puzzle"

