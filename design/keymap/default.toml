"esc" = "layer.escape"
":" = "cmdline.open"
"/" = "search.open"
"?" = "help.context"
"F" = "hint.open"
"u" = "undo"
"U" = "redo"
"mod+z" = "undo"
"mod+shift+z" = "redo"
"." = "repeat"
