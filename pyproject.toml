[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spaced-positions"
version = "0.1.0"
description = "Collect, solve and train chess puzzles: keyboard first, spaced repetition."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "django>=6.0",
    "waitress>=3.0",
    "whitenoise>=6.7",
    "platformdirs>=4.2",
    "chess>=1.10",
]

[project.urls]
Source = "https://github.com/Piscary/SpacedPositions"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "playwright>=1.48", "pillow>=10", "pyinstaller>=6.10"]

[project.scripts]
spos = "spaced_positions.launcher:main"

[tool.setuptools.packages.find]
include = ["spaced_positions*"]

[tool.setuptools.package-data]
# Every file the app reads at run time: tests/test_launcher.py checks that nothing in the package is left out
spaced_positions = ["templates/**/*", "static/**/*", "locale/*/LC_MESSAGES/*", "library/data/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: needs Playwright and a Chromium install"]
