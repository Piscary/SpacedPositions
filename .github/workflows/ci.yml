# CI for the design system and the app (spec 07 §8).
name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - name: Design lint (tokens, contrast, keymap, references, CSS literals, licences, generated files)
        run: python manage.py design check
      - name: Python tests
        run: python -m pytest -m "not browser"
      - name: JavaScript unit tests
        run: node --experimental-default-type=module --test tests/js/

  browser:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Keyboard journeys, latency budget, screenshots
        run: python -m pytest -m browser
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/current/
