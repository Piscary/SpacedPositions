# CI for the design system and the app (spec 07 §8): on every push and pull request. A failing test shows as an
# annotation with its message on the run's page (tests/conftest.py).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-2025, python: "3.13" }  # the double-click app's main platform among testers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Design lint (tokens, contrast, keymap, references, CSS literals, licences, generated files, translations)
        if: runner.os == 'Linux'
        run: python manage.py design check
      - name: Python tests
        run: python -m pytest -m "not browser"
      - name: JavaScript unit tests
        shell: bash
        run: node --experimental-default-type=module --test tests/js/*.test.mjs

  browser:
    runs-on: ${{ matrix.os }}
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
        shell: bash
      - name: Keyboard journeys, latency budget, screenshots
        run: python -m pytest -m browser
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/screenshots/current/
          if-no-files-found: ignore
