# The double-click apps (spec 09 §11) for a version tag (`git tag v0.2.0 && git push --tags`): a .dmg for macOS and a
# .zip for Windows, attached to a draft GitHub release that is published by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -m "not browser"
      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: sh packaging/build-macos.sh
      - name: Windows app folder as a zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python manage.py design build
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/spos.spec
          $version = python -c "import spaced_positions; print(spaced_positions.__version__)"
          Compress-Archive -Path "dist/Spaced Positions" -DestinationPath "dist/Spaced-Positions-$version-Windows.zip"
      - name: Smoke test the built app
        shell: bash
        run: python packaging/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
