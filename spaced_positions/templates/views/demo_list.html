{% demo_rows as demo_rows %}<div class="list" data-list role="listbox" aria-multiselectable="true">
  {% for id, title, tags, solved in demo_rows %}
  <div class="list__row" role="option" data-row="{{ id }}" data-title="{{ title }}" aria-selected="false">
    <span class="list__mark" aria-hidden="true">▢</span>
    <span class="list__id">{{ id }}</span>
    <span class="list__title">{{ title }}</span>
    <span class="list__meta">{% for tag in tags %}<span class="chip chip--tag">{{ tag }}</span>{% endfor %}{% if solved %}<span class="chip chip--good">✓ solution</span>{% else %}<span class="chip chip--bad">✗ solution</span>{% endif %}</span>
  </div>
  {% endfor %}
</div>
