<form class="view-stack" data-notes>
  <p class="muted">Focusing a field switches to the <b>Insert</b> layer (the status line turns green): every key types. <kbd class="keycap">Esc</kbd> leaves the field and keeps the text; {% keycap "mod+enter" %} submits.</p>
  <div class="formrow">
    <label class="formrow__label" for="{{ node.id }}-title">Title</label>
    <input class="field" id="{{ node.id }}-title" name="title" placeholder="Type here: j, k and space type letters now">
    <div class="formrow__help"><span>A TextField.</span></div>
  </div>
  <div class="formrow">
    <label class="formrow__label" for="{{ node.id }}-text">Notes</label>
    <textarea class="field" id="{{ node.id }}-text" name="text" placeholder="A TextArea"></textarea>
  </div>
  <div class="actionbar">{% cmd "form.submit" label="Save note" variant="primary" %}</div>
</form>
